<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ozzywow</title>
<meta name="description" content="Games and projects by ozzywow — including Tower of Hanoi - Speedrun for iOS and Android.">
<meta name="robots" content="index,follow">
<meta name="naver-site-verification" content="2ab0eafac55113d7ee4e31dc647e2bab28967cd5" />
<link rel="canonical" href="https://ozzywow.github.io/">
<meta property="og:title" content="ozzywow">
<meta property="og:description" content="Games and projects by ozzywow.">
<meta property="og:type" content="website">

<meta name="theme-color" content="#0a0e1a">
<style>
  :root{
    --bg:#0a0e1a; --card:#141c30; --line:#243049;
    --fg:#eaf0f8; --sub:#98a6be; --blue:#5aa0ff; --mint:#3ecf9a;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:radial-gradient(1000px 500px at 50% -10%, #1a2547 0%, transparent 60%), var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .wrap{max-width:560px; width:100%}
  h1{font-size:clamp(28px,7vw,40px); font-weight:800; letter-spacing:-.5px; text-align:center}
  .tag{color:var(--sub); text-align:center; margin:8px 0 32px; font-size:15px}
  a.card{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px; transition:transform .12s ease, border-color .12s ease;
  }
  a.card:hover{transform:translateY(-2px); border-color:var(--blue)}
  .card h2{font-size:19px; font-weight:700; margin-bottom:5px}
  .card p{color:var(--sub); font-size:14px}
  .card .go{color:var(--mint); font-size:13px; font-weight:700; margin-top:12px; display:block}
  footer{text-align:center; color:var(--sub); font-size:13px; margin-top:32px}
  footer a{color:var(--blue); text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>ozzywow</h1>
  <p class="tag">Games and projects</p>

  <a class="card" href="https://ozzywow.github.io/Hanoi/">
    <h2>🗼 Tower of Hanoi - Speedrun</h2>
    <p>The classic Tower of Hanoi, reimagined as a global speedrun. Race the clock, climb the world rankings, and challenge the ghosts of the top players. Available on iOS and Android.</p>
    <span class="go">Visit site →</span>
  </a>

  <footer>
    <a href="https://github.com/ozzywow">GitHub</a> ·
    <a href="mailto:ozzywow2@gmail.com">ozzywow2@gmail.com</a>
  </footer>
</div>
</body>
</html>
